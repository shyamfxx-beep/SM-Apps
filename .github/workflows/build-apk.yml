name: Build & Sign Telemetry Suite APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore from Secrets
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Inject Google Services JSON (if available)
        env:
          GOOGLE_SERVICES_JSON_AGENT: ${{ secrets.GOOGLE_SERVICES_JSON_AGENT }}
          GOOGLE_SERVICES_JSON_OWNER: ${{ secrets.GOOGLE_SERVICES_JSON_OWNER }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_AGENT" ]; then
            echo "$GOOGLE_SERVICES_JSON_AGENT" > agent-app/google-services.json
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_OWNER" ]; then
            echo "$GOOGLE_SERVICES_JSON_OWNER" > owner-app/google-services.json
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename Artifacts
        run: |
          mkdir -p output/
          AGENT_APK=$(find agent-app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          OWNER_APK=$(find owner-app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ -f "$AGENT_APK" ]; then
            cp "$AGENT_APK" output/SM-DriverRewards-release.apk
          fi
          if [ -f "$OWNER_APK" ]; then
            cp "$OWNER_APK" output/SM-OwnerConsole-release.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm-telemetry-apks
          path: output/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
